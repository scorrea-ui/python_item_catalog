services:
  db:
    image: postgres:16
    container_name: catalog_db
    restart: always
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
